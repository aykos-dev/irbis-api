# Dev server (devapi.wayout.uz). Values come from deploy/.env on the server (see deploy/.env.example).
# global-nginx reaches irbis-api and irbis-s3 by name over gateway_net.
name: irbis-api

services:
  db:
    image: postgres:17
    container_name: irbis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - irbis-db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage (MinIO no longer publishes images). Admin identity from the S3_* values;
  # anonymous may only read the bucket, and nginx exposes just its lessons/ prefix.
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: irbis-s3
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"irbis\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]},{\"name\":\"anonymous\",\"actions\":[\"Read:%s\"]}]}'
      \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" \"$$S3_BUCKET\" > /tmp/s3.json &&
      exec weed server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      "
    volumes:
      - irbis-s3:/data
    networks: [internal, gateway_net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8333/healthz >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the bucket.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      echo \"s3.bucket.list\" | weed shell -master=s3:9333 | grep -qw \"$$S3_BUCKET\" ||
      echo \"s3.bucket.create -name $$S3_BUCKET\" | weed shell -master=s3:9333
      "
    networks: [internal]
    restart: 'no'

  # One-shot: applies pending migrations before the API starts.
  migrate:
    build: ..
    image: irbis-api:latest
    env_file: .env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: 'no'

  api:
    image: irbis-api:latest
    container_name: irbis-api
    restart: unless-stopped
    env_file: .env
    environment:
      S3_ENDPOINT: http://s3:8333
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    networks: [internal, gateway_net]

volumes:
  irbis-db:
  irbis-s3:

networks:
  internal:
  gateway_net:
    external: true
